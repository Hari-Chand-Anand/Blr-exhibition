<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GARTEX Exhibition Catalogs</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fafafa 0%, #f5f5f5 100%);
            color: #2c2c2c;
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: white;
            padding: 40px 0;
            border-bottom: 1px solid #e8e8e8;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
            text-align: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: #8b2e2e;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .tagline {
            font-size: 11px;
            color: #999;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Hero Section */
        .hero {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 40px 40px;
            text-align: center;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            color: #1a1a1a;
            margin-bottom: 16px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 16px;
            color: #777;
            margin-bottom: 8px;
            font-weight: 300;
        }

        /* Gallery */
        .gallery {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px 80px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 40px;
        }

        .catalog-card {
            background: white;
            border: none;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 30px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        .catalog-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #8b2e2e, transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .catalog-card:hover {
            box-shadow: 0 12px 24px rgba(0,0,0,0.08);
            transform: translateY(-6px);
        }

        .catalog-card:hover::before {
            opacity: 1;
        }

        .catalog-icon {
            font-size: 48px;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .catalog-card:hover .catalog-icon {
            transform: scale(1.1);
        }

        .catalog-info {
            flex: 1;
        }

        .catalog-name {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 10px;
            letter-spacing: -0.3px;
        }

        .catalog-info-text {
            font-size: 13px;
            color: #999;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            overflow-y: auto;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: white;
            margin: 40px auto;
            width: 90%;
            max-width: 900px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            max-height: 85vh;
            animation: slideUp 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        @keyframes slideUp {
            from {
                transform: translateY(60px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 40px;
            border-bottom: 1px solid #e8e8e8;
            flex-shrink: 0;
        }

        .modal-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: #1a1a1a;
            margin: 0;
            font-weight: 700;
        }

        .modal-close {
            font-size: 32px;
            font-weight: 300;
            color: #ccc;
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1;
            width: 32px;
            text-align: center;
        }

        .modal-close:hover {
            color: #8b2e2e;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            background: #fafafa;
        }

        #pdfViewer {
            width: 100%;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        #pdfViewer canvas.pdf-page {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            background: white;
        }

        .pdf-status {
            width: 100%;
            padding: 60px 20px;
            text-align: center;
            color: #999;
            font-size: 14px;
        }

        .modal-footer {
            display: flex;
            gap: 15px;
            padding: 30px 40px;
            border-top: 1px solid #e8e8e8;
            flex-shrink: 0;
        }

        .btn {
            flex: 1;
            padding: 14px 30px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .btn-download {
            background: #8b2e2e;
            color: white;
        }

        .btn-download:hover {
            background: #6b2020;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 46, 46, 0.2);
        }

        .btn-close {
            background: white;
            color: #2c2c2c;
            border: 1.5px solid #e0e0e0;
        }

        .btn-close:hover {
            border-color: #8b2e2e;
            color: #8b2e2e;
        }

        /* Breadcrumb / Back Navigation */
        .breadcrumb-nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px 20px;
            display: none;
            align-items: center;
            gap: 16px;
        }

        .breadcrumb-nav.active {
            display: flex;
        }

        .back-btn {
            background: none;
            border: 1.5px solid #e0e0e0;
            color: #2c2c2c;
            padding: 10px 20px;
            border-radius: 6px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
        }

        .back-btn:hover {
            border-color: #8b2e2e;
            color: #8b2e2e;
        }

        .brand-title {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            color: #1a1a1a;
            font-weight: 700;
        }

        /* Brand Cards */
        .brand-card .catalog-icon {
            font-size: 40px;
        }

        .brand-card .catalog-name {
            font-size: 20px;
            letter-spacing: 0.5px;
        }

        .model-count {
            display: inline-block;
            margin-top: 6px;
            padding: 4px 12px;
            background: #f5eaea;
            color: #8b2e2e;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        /* Footer */
        .footer {
            background: white;
            border-top: 1px solid #e8e8e8;
            padding: 50px 40px;
            text-align: center;
            color: #999;
            font-size: 13px;
            margin-top: 60px;
            font-weight: 300;
        }

        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 0 20px 60px;
            }

            .hero h1 {
                font-size: 36px;
            }

            .header-content,
            .hero,
            .footer {
                padding: 20px;
            }

            .catalog-card {
                padding: 40px 20px;
            }

            .modal-content {
                width: 95%;
                margin: 50% auto 20px;
            }

            .modal-header,
            .modal-body,
            .modal-footer {
                padding: 20px;
            }

            .modal-footer {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <div class="logo">HARI CHAND ANAND & CO.</div>
            <div class="tagline">Automation Affordable Since 1910</div>
        </div>
    </div>

    <!-- Hero Section -->
    <div class="hero">
        <h1>Exhibition Catalogs</h1>
    </div>

    <!-- Breadcrumb / Back Navigation -->
    <div class="breadcrumb-nav" id="breadcrumbNav">
        <button class="back-btn" onclick="showBrandView()">← Back to Brands</button>
        <div class="brand-title" id="brandTitle"></div>
    </div>

    <!-- Gallery -->
    <div class="gallery" id="gallery"></div>

    <!-- Footer -->
    <div class="footer">
        <p>&copy; 2026 Hari Chand Anand & Co. All rights reserved.</p>
    </div>

    <!-- Modal -->
    <div id="pdfModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="catalogTitle"></h2>
                <span class="modal-close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div id="pdfViewer"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-download" id="downloadBtn">DOWNLOAD CATALOG</button>
                <button class="btn btn-close" onclick="closeModal()">CLOSE</button>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // NOTE: order below is fixed — printed QR codes reference catalogs by
        // position (?catalog=1..25). Only ever APPEND new catalogs at the end.
        const catalogs = [
            { name: 'DEX32_52DM', file: 'Catalogs/Catalogs/DEX32_52DM.pdf', brand: 'HUATANG LOIVA' },
            { name: 'DY 1411PSF-D', file: 'Catalogs/Catalogs/DY 1411PSF-D.pdf', brand: 'DUKE' },
            { name: 'DY 1509 PD', file: 'Catalogs/Catalogs/DY 1509 PD.pdf', brand: 'DUKE' },
            { name: 'DY 1790S', file: 'Catalogs/Catalogs/DY 1790S.pdf', brand: 'DUKE' },
            { name: 'DY 2210G', file: 'Catalogs/Catalogs/DY 2210G.pdf', brand: 'DUKE' },
            { name: 'DY 3020', file: 'Catalogs/Catalogs/DY 3020.pdf', brand: 'DUKE' },
            { name: 'DY 430GT-01', file: 'Catalogs/Catalogs/DY 430GT-01.pdf', brand: 'DUKE' },
            { name: 'DY 438GT LA 971', file: 'Catalogs/Catalogs/DY 438GT LA 971.pdf', brand: 'DUKE' },
            { name: 'DY 4406P-D', file: 'Catalogs/Catalogs/DY 4406P-D.pdf', brand: 'DUKE' },
            { name: 'DY 5030', file: 'Catalogs/Catalogs/DY 5030.pdf', brand: 'DUKE' },
            { name: 'DY GC510-360 SERIES', file: 'Catalogs/Catalogs/DY GC510-360 SERIES.pdf', brand: 'DUKE' },
            { name: 'DY R9', file: 'Catalogs/Catalogs/DY R9.pdf', brand: 'DUKE' },
            { name: 'FB 450-12-0640', file: 'Catalogs/Catalogs/FB 450-12-0640.pdf', brand: 'HUATANG LOIVA' },
            { name: 'FB450', file: 'Catalogs/Catalogs/FB450.pdf', brand: 'HUATANG LOIVA' },
            { name: 'IEX32_52DM', file: 'Catalogs/Catalogs/IEX32_52DM.pdf', brand: 'HUATANG LOIVA' },
            { name: 'JT A8', file: 'Catalogs/Catalogs/JT A8.pdf', brand: 'JUITA' },
            { name: 'JTK 18F', file: 'Catalogs/Catalogs/JTK 18F.pdf', brand: 'JUITA' },
            { name: 'JTK6-60A', file: 'Catalogs/Catalogs/JTK6-60A.pdf', brand: 'JUITA' },
            { name: 'LS6021NP', file: 'Catalogs/Catalogs/LS6021NP.pdf', brand: 'LENSH' },
            { name: 'LS9231C', file: 'Catalogs/Catalogs/LS9231C.pdf', brand: 'LENSH' },
            { name: 'NF 1104_1106', file: 'Catalogs/Catalogs/NF 1104_1106.pdf', brand: 'HUATANG LOIVA' },
            { name: 'VIOS 669', file: 'Catalogs/Catalogs/VIOS 669.pdf', brand: 'VIOS' },
            { name: 'VIOS 867', file: 'Catalogs/Catalogs/VIOS 867.pdf', brand: 'VIOS' },
            { name: 'VIOS 868', file: 'Catalogs/Catalogs/VIOS 868.pdf', brand: 'VIOS' },
            { name: 'DY G36', file: 'Catalogs/Catalogs/DY G36.pdf', brand: 'DUKE' }
        ];

        // Brand display order (alphabetical)
        const BRANDS = ['DUKE', 'HUATANG LOIVA', 'JUITA', 'LENSH', 'VIOS'];

        const modal = document.getElementById('pdfModal');
        const gallery = document.getElementById('gallery');
        const breadcrumbNav = document.getElementById('breadcrumbNav');
        const brandTitle = document.getElementById('brandTitle');

        let currentBrand = null;

        function renderBrands() {
            currentBrand = null;
            breadcrumbNav.classList.remove('active');
            gallery.innerHTML = '';
            BRANDS.forEach(brand => {
                const count = catalogs.filter(c => c.brand === brand).length;
                const card = document.createElement('div');
                card.className = 'catalog-card brand-card';
                card.onclick = () => showCatalogView(brand);
                card.innerHTML = `
                    <div class="catalog-icon">🏷️</div>
                    <div class="catalog-info">
                        <div class="catalog-name">${brand}</div>
                        <div class="model-count">${count} Model${count !== 1 ? 's' : ''}</div>
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        function showCatalogView(brand) {
            currentBrand = brand;
            breadcrumbNav.classList.add('active');
            brandTitle.textContent = brand;
            renderCatalogCards(catalogs.filter(c => c.brand === brand));
        }

        function showBrandView() {
            renderBrands();
        }

        function renderCatalogCards(itemsToShow) {
            gallery.innerHTML = '';
            itemsToShow.forEach(catalog => {
                const card = document.createElement('div');
                card.className = 'catalog-card';
                card.onclick = () => openPDF(catalog.file, catalog.name);
                card.innerHTML = `
                    <div class="catalog-icon">📄</div>
                    <div class="catalog-info">
                        <div class="catalog-name">${catalog.name}</div>
                        <div class="catalog-info-text">View Catalog</div>
                    </div>
                `;
                gallery.appendChild(card);
            });
        }

        let currentRenderToken = 0;

        async function openPDF(filePath, catalogName) {
            document.getElementById('catalogTitle').textContent = catalogName;
            document.getElementById('downloadBtn').onclick = () => downloadPDF(filePath, catalogName);
            modal.style.display = 'block';
            document.body.style.overflow = 'hidden';

            const viewer = document.getElementById('pdfViewer');
            const myToken = ++currentRenderToken;
            viewer.innerHTML = '<div class="pdf-status">Loading catalog…</div>';

            try {
                const pdf = await pdfjsLib.getDocument(filePath).promise;
                if (myToken !== currentRenderToken) return; // modal closed / another catalog opened meanwhile
                viewer.innerHTML = '';

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    if (myToken !== currentRenderToken) return;
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 2 });

                    const canvas = document.createElement('canvas');
                    canvas.className = 'pdf-page';
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    viewer.appendChild(canvas);

                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                }
            } catch (err) {
                if (myToken === currentRenderToken) {
                    viewer.innerHTML = '<div class="pdf-status">Preview unavailable. Please use the download button below.</div>';
                }
            }
        }

        function closeModal() {
            currentRenderToken++; // cancel any in-flight rendering
            modal.style.display = 'none';
            document.getElementById('pdfViewer').innerHTML = '';
            document.body.style.overflow = 'auto';
        }

        function downloadPDF(filePath, catalogName) {
            const link = document.createElement('a');
            link.href = filePath;
            link.download = catalogName + '.pdf';
            link.click();
        }

        window.onclick = (event) => {
            if (event.target === modal) {
                closeModal();
            }
        };

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        function openCatalogFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const catalogParam = params.get('catalog');
            if (!catalogParam) return;

            // Supports either a 1-based index (?catalog=3) or a name match (?catalog=DY%20R9)
            const index = parseInt(catalogParam, 10);
            let match = null;
            if (!isNaN(index) && catalogs[index - 1]) {
                match = catalogs[index - 1];
            } else {
                match = catalogs.find(c => c.name.toLowerCase() === catalogParam.toLowerCase());
            }
            if (match) {
                openPDF(match.file, match.name);
            }
        }

        renderBrands();
        openCatalogFromUrl();
    </script>
</body>
</html>
